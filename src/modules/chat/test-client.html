<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Module Test Client</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            height: calc(100vh - 40px);
        }

        .panel {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid #e4e6eb;
            background: #0084ff;
            color: white;
        }

        .panel-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .status {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status.connected {
            background: #31a24c;
        }

        .status.disconnected {
            background: #fa3e3e;
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
        }

        .conversation-item {
            padding: 12px 20px;
            border-bottom: 1px solid #e4e6eb;
            cursor: pointer;
            transition: background 0.2s;
        }

        .conversation-item:hover {
            background: #f2f3f5;
        }

        .conversation-item.active {
            background: #e7f3ff;
        }

        .conversation-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .conversation-details {
            flex: 1;
        }

        .conversation-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .last-message {
            font-size: 13px;
            color: #65676b;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-area {
            display: flex;
            flex-direction: column;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column-reverse;
        }

        .message {
            display: flex;
            margin-bottom: 12px;
            animation: slideIn 0.2s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.own {
            flex-direction: row-reverse;
        }

        .message-bubble {
            max-width: 60%;
            padding: 8px 12px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .message.own .message-bubble {
            background: #0084ff;
            color: white;
        }

        .message:not(.own) .message-bubble {
            background: #e4e6eb;
            color: #050505;
        }

        .message-sender {
            font-size: 11px;
            color: #65676b;
            margin-bottom: 4px;
            padding: 0 12px;
        }

        .typing-indicator {
            display: none;
            padding: 8px 12px;
            color: #65676b;
            font-size: 13px;
            font-style: italic;
        }

        .typing-indicator.active {
            display: block;
        }

        .message-input-area {
            padding: 20px;
            border-top: 1px solid #e4e6eb;
            display: flex;
            gap: 12px;
        }

        .message-input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #ccd0d5;
            border-radius: 20px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .message-input:focus {
            border-color: #0084ff;
        }

        .send-button {
            padding: 10px 24px;
            background: #0084ff;
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .send-button:hover {
            background: #0073e6;
        }

        .send-button:disabled {
            background: #bcc0c4;
            cursor: not-allowed;
        }

        .config-panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .config-panel input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccd0d5;
            border-radius: 6px;
        }

        .config-panel button {
            width: 100%;
            padding: 10px;
            background: #42b72a;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .config-panel button:hover {
            background: #36a420;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #65676b;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 16px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="config-panel">
        <h3>Configuration</h3>
        <input type="text" id="serverUrl" placeholder="Server URL (e.g., http://localhost:3000)" value="http://localhost:3000">
        <input type="text" id="userId" placeholder="Your User ID">
        <button onclick="connect()">Connect</button>
    </div>

    <div class="container">
        <!-- Conversations Sidebar -->
        <div class="panel">
            <div class="panel-header">
                <h2>
                    <span class="status disconnected" id="statusIndicator"></span>
                    Conversations
                </h2>
            </div>
            <div class="conversations-list" id="conversationsList">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
                    </svg>
                    <p>Connect to load conversations</p>
                </div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="panel chat-area">
            <div class="panel-header">
                <h2 id="chatHeader">Select a conversation</h2>
            </div>
            <div class="messages-container" id="messagesContainer">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
                    </svg>
                    <p>Start chatting!</p>
                </div>
            </div>
            <div class="typing-indicator" id="typingIndicator">
                Someone is typing...
            </div>
            <div class="message-input-area">
                <input 
                    type="text" 
                    class="message-input" 
                    id="messageInput" 
                    placeholder="Type a message..." 
                    disabled
                >
                <button class="send-button" id="sendButton" onclick="sendMessage()" disabled>
                    Send
                </button>
            </div>
        </div>
    </div>

    <script>
        let socket = null;
        let currentConversationId = null;
        let currentUserId = null;
        let typingTimeout = null;

        function connect() {
            const serverUrl = document.getElementById('serverUrl').value;
            const userId = document.getElementById('userId').value;

            if (!userId) {
                alert('Please enter your User ID');
                return;
            }

            currentUserId = userId;

            // Disconnect existing socket
            if (socket) {
                socket.disconnect();
            }

            // Connect to server
            socket = io(`${serverUrl}/chat`, {
                query: { userId }
            });

            socket.on('connect', () => {
                console.log('Connected to server');
                document.getElementById('statusIndicator').className = 'status connected';
                loadConversations();
            });

            socket.on('disconnect', () => {
                console.log('Disconnected from server');
                document.getElementById('statusIndicator').className = 'status disconnected';
            });

            socket.on('message:new', (message) => {
                console.log('New message:', message);
                if (message.conversationId === currentConversationId) {
                    displayMessage(message);
                }
            });

            socket.on('typing:start', ({ userId }) => {
                console.log('User typing:', userId);
                if (userId !== currentUserId) {
                    document.getElementById('typingIndicator').classList.add('active');
                }
            });

            socket.on('typing:stop', ({ userId }) => {
                console.log('User stopped typing:', userId);
                document.getElementById('typingIndicator').classList.remove('active');
            });

            socket.on('user:online', ({ userId }) => {
                console.log('User online:', userId);
            });

            socket.on('user:offline', ({ userId }) => {
                console.log('User offline:', userId);
            });
        }

        function loadConversations() {
            socket.emit('conversations:get', {
                userId: currentUserId,
                page: 1,
                limit: 20
            }, (response) => {
                if (response.error) {
                    console.error('Error:', response.error);
                    alert(response.error);
                    return;
                }
                displayConversations(response.data);
            });
        }

        function displayConversations(conversations) {
            const list = document.getElementById('conversationsList');
            
            if (!conversations || conversations.length === 0) {
                list.innerHTML = '<div class="empty-state"><p>No conversations yet</p></div>';
                return;
            }

            list.innerHTML = conversations.map(conv => {
                const otherUser = conv.participants.find(p => p._id !== currentUserId);
                const displayName = conv.isGroup ? conv.name : (otherUser?.fullName || otherUser?.username || 'Unknown');
                const initials = displayName.substring(0, 2).toUpperCase();

                return `
                    <div class="conversation-item" onclick="selectConversation('${conv._id}', '${displayName}')">
                        <div class="conversation-info">
                            <div class="avatar">${initials}</div>
                            <div class="conversation-details">
                                <div class="conversation-name">${displayName}</div>
                                <div class="last-message">
                                    ${conv.lastMessage?.text || 'No messages yet'}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectConversation(conversationId, name) {
            currentConversationId = conversationId;
            document.getElementById('chatHeader').textContent = name;
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendButton').disabled = false;

            // Update active state
            document.querySelectorAll('.conversation-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');

            // Join conversation
            socket.emit('conversation:join', {
                userId: currentUserId,
                conversationId
            }, (response) => {
                if (response.error) {
                    console.error('Error:', response.error);
                    return;
                }
                console.log('Joined conversation');
            });

            // Load messages
            loadMessages(conversationId);
        }

        function loadMessages(conversationId) {
            socket.emit('messages:get', {
                userId: currentUserId,
                conversationId,
                page: 1,
                limit: 50
            }, (response) => {
                if (response.error) {
                    console.error('Error:', response.error);
                    return;
                }

                const container = document.getElementById('messagesContainer');
                container.innerHTML = '';
                
                response.data.reverse().forEach(message => {
                    displayMessage(message, false);
                });
            });
        }

        function displayMessage(message, animate = true) {
            const container = document.getElementById('messagesContainer');
            const isOwn = message.sender._id === currentUserId;
            
            const messageEl = document.createElement('div');
            messageEl.className = `message ${isOwn ? 'own' : ''}`;
            if (!animate) messageEl.style.animation = 'none';
            
            messageEl.innerHTML = `
                ${!isOwn ? `<div class="message-sender">${message.sender.fullName || message.sender.username}</div>` : ''}
                <div class="message-bubble">${escapeHtml(message.text)}</div>
            `;
            
            container.insertBefore(messageEl, container.firstChild);
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text || !currentConversationId) return;

            socket.emit('message:send', {
                userId: currentUserId,
                conversationId: currentConversationId,
                text
            }, (response) => {
                if (response.error) {
                    console.error('Error:', response.error);
                    return;
                }
                console.log('Message sent:', response.message);
            });

            input.value = '';
            stopTyping();
        }

        // Handle typing indicator
        document.getElementById('messageInput')?.addEventListener('input', () => {
            if (!currentConversationId) return;
            
            socket.emit('typing:start', {
                userId: currentUserId,
                conversationId: currentConversationId
            });
            
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                stopTyping();
            }, 2000);
        });

        function stopTyping() {
            if (currentConversationId) {
                socket.emit('typing:stop', {
                    userId: currentUserId,
                    conversationId: currentConversationId
                });
            }
        }

        // Handle Enter key
        document.getElementById('messageInput')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
